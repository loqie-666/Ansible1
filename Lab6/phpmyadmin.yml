---
# Lab 6: phpMyAdmini paigaldamine Debian kliendile
# Ansible-server: 192.168.41.145, klient1: 192.168.41.146
- name: phpMyAdmini paigaldamine
  hosts: klient1

  tasks:
    # Task 1: uuendame pakettide nimekirja (apt moodul)
    - name: Uuendame pakettide nimekirja
      apt:
        update_cache: yes

    # Task 2: paigaldame phpMyAdmin paketi (apt moodul)
    - name: Paigaldame phpMyAdmin paketi
      apt:
        name: phpmyadmin
        state: present

    # Task 3: loome symboolse lingi phpMyAdmini kaustale Apache veebikataloogis (file moodul)
    - name: Tagame, et phpMyAdmini sümboolne link on Apache'i kataloogis
      file:
        src: /usr/share/phpmyadmin
        dest: /var/www/html/phpmyadmin
        state: link

    # Task 4: taaskaivitame Apache teenuse (service moodul)
    - name: Taaskäivitame Apache teenuse
      service:
        name: apache2
        state: restarted

    # Task 5: kontrollime HTTP paringuga, et phpMyAdmin on ligipaasetav (uri, register, failed_when)
    - name: Veendume, et Apache töötab ja phpMyAdmin on ligipääsetav
      uri:
        url: http://localhost/phpmyadmin/
        return_content: yes
        status_code: 200
      register: phpmyadmin_vastus
      failed_when: "'phpMyAdmin' not in phpmyadmin_vastus.content"

    # Iseseisev ylesanne 1: loome config.inc.php Jinja2 malli abil (template moodul)
    - name: Seadistame phpMyAdmini config.inc.php faili
      template:
        src: config.inc.php.j2
        dest: /usr/share/phpmyadmin/config.inc.php
        owner: root
        group: root
        mode: '0644'
      vars:
        pma_blowfish_secret: "qwertyuiopasdfghjklzxcvbnm123456"
        pma_mysql_host: localhost
