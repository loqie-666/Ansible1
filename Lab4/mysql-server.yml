---
# Lab 4: MySQL serveri paigaldamine Debian kliendile
# Ansible-server: 192.168.41.145, klient1: 192.168.41.146
- name: MySQL serveri paigaldamine
  hosts: klient1

  tasks:
    # Task 1: loome kataloogi allalaaditud failide jaoks (file moodul)
    - name: Loome allalaaditud kataloog
      file:
        path: /root/allalaadimised
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Task 2: laadime MySQL APT repositooriumi paketi wget abil (shell moodul)
    - name: Laadime MySQL APT paketi wget abil
      shell: wget -O /root/allalaadimised/mysql-apt-config_0.8.36-1_all.deb https://dev.mysql.com/get/mysql-apt-config_0.8.36-1_all.deb
      args:
        creates: /root/allalaadimised/mysql-apt-config_0.8.36-1_all.deb

    # Task 3: paigaldame gnupg (vajalik GPG votmete tootlemiseks)
    - name: Paigalda gnupg
      apt:
        name: gnupg
        state: present

    # Task 4: paigaldame MySQL repositooriumi paketi (apt moodul, deb parameeter)
    - name: Installeerime mysql repositoorium
      apt:
        deb: /root/allalaadimised/mysql-apt-config_0.8.36-1_all.deb

    # Task 5: pärast repositooriumi lisamist teeme apt update
    - name: Teeme apt-le update
      apt:
        update_cache: yes

    # Task 6: paigaldame MySQL serveri (apt moodul)
    - name: Paigaldame mysql-server
      apt:
        name: mysql-server
        state: present
